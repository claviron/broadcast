[package]
name = "claviron-broadcast"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
include.workspace = true
autotests = false
description = "Realtime sessions, channel publication, and fleet fanout for Claviron"
keywords = ["broadcast", "pusher", "websocket", "realtime", "pubsub"]
categories = ["web-programming::websocket", "network-programming", "asynchronous"]

[features]
default = []
# Native authenticated REST publication, without a Rust router framework.
http = ["dep:claviron-http", "dep:http-body-util"]
# A session at `/app/{key}`, on every door.
websocket = ["http", "claviron-http/websocket", "dep:claviron-transport", "claviron-transport/websocket-session"]
# Configured REST owners for a host-free Pipeline site registry.
backend = ["http", "dep:claviron-pipeline", "dep:serde_yaml"]
# External Pusher-compatible HTTP/WebSocket upstreams.
pusher = ["claviron-pusher/http"]
# The site directive on a virtual host. Edge remains optional and opens no socket.
edge = ["backend", "websocket", "dep:claviron-edge", "claviron-edge/websocket"]
webtransport = ["claviron-edge?/webtransport"]
# The service's endpoints in front of a language runner's owner, on every door.
runner = ["websocket", "dep:claviron-runner", "claviron-runner/orbit", "dep:claviron-types", "dep:tower"]

[dependencies]
# Claviron contracts and lifecycle
claviron = { workspace = true, features = ["orbit"] }
claviron-app.workspace = true
claviron-edge = { workspace = true, optional = true }
claviron-http = { workspace = true, optional = true }
claviron-orbit.workspace = true
claviron-pipeline = { workspace = true, optional = true }
claviron-pusher.workspace = true
claviron-runner = { workspace = true, optional = true }
claviron-transport = { workspace = true, optional = true }
claviron-types = { workspace = true, optional = true }
claviron-runtime.workspace = true

# Runtime and shared state
arc-swap.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

# Protocol data and diagnostics
bytes.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
http.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

# Optional HTTP/WebSocket adapters
http-body-util = { workspace = true, optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }

[dev-dependencies]
fastwebsockets = { workspace = true, features = ["upgrade"] }
hyper-util = { workspace = true, features = ["tokio"] }
claviron-http = { workspace = true, features = ["server"] }
claviron-types.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
serde_yaml.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[workspace]
members = ["crates/pusher"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.26"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/claviron/broadcast"
homepage = "https://github.com/claviron/broadcast"
authors = ["ilker Arabaci <iadev09@claviron.dev>"]
publish = true
include = ["/src/**/*.rs", "/tests/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[workspace.dependencies]
arc-swap = "1.9"
async-trait = "0.1"
bytes = "1.11"
chrono = { version = "0.4", default-features = false }
claviron = { version = "0.2.0-alpha.26", path = "../../claviron", default-features = false }
claviron-app = { version = "0.2.0-alpha.26", path = "../../claviron/crates/app" }
claviron-edge = { version = "0.2.0-alpha.26", path = "../../claviron/crates/edge" }
claviron-helpers = { version = "0.2.0-alpha.26", path = "../../claviron/crates/helpers" }
claviron-http = { version = "0.2.0-alpha.26", path = "../../claviron/crates/http" }
claviron-orbit = { version = "0.2.0-alpha.26", path = "../../claviron/crates/orbit" }
claviron-pipeline = { version = "0.2.0-alpha.26", path = "../../claviron/crates/pipeline" }
claviron-pusher = { version = "0.2.0-alpha.26", path = "crates/pusher" }
claviron-runner = { version = "0.2.0-alpha.26", path = "../../claviron/crates/runner" }
claviron-transport = { version = "0.2.0-alpha.26", path = "../../claviron/crates/transport" }
claviron-runtime = { version = "0.2.0-alpha.26", path = "../../claviron/crates/runtime" }
claviron-types = { version = "0.2.0-alpha.26", path = "../../claviron/crates/types", default-features = false }
fastwebsockets = { version = "0.10", default-features = false }
hex = "0.4"
hmac = "0.13"
http = "1.4"
http-body = "1"
http-body-util = "0.1"
hyper = "1.12"
hyper-util = "0.1"
md-5 = "0.11"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
url = "2.5"

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[[test]]
name = "websocket"
path = "tests/websocket.rs"
required-features = ["websocket"]
